<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portal Demo Capa C</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, sans-serif;
        background: #0b1020;
        color: #f2f5f7;
      }

      body {
        margin: 0;
        padding: 32px;
      }

      main {
        max-width: 880px;
        margin: 0 auto;
      }

      form {
        display: grid;
        grid-template-columns: repeat(2, minmax(220px, 1fr));
        gap: 14px;
        padding: 24px;
        border: 1px solid #2dd4bf;
        border-radius: 12px;
        background: #11182d;
      }

      h1,
      .wide {
        grid-column: 1 / -1;
      }

      label {
        display: grid;
        gap: 6px;
        color: #aeb8c5;
        font-size: 13px;
      }

      input,
      select {
        min-height: 38px;
        border: 1px solid #334155;
        border-radius: 8px;
        background: #071022;
        color: #f8fafc;
        padding: 0 10px;
        font-size: 15px;
      }

      .captcha-box {
        border: 1px dashed #fbbf24;
        border-radius: 10px;
        padding: 16px;
        background: rgba(251, 191, 36, 0.08);
      }

      button {
        width: max-content;
        border: 0;
        border-radius: 999px;
        background: #8ee6c4;
        color: #08211b;
        padding: 11px 18px;
        font-size: 15px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <form id="invoice-form">
        <h1>Facturacion demo con CAPTCHA</h1>
        <label>
          RFC receptor
          <input id="rfc-receptor" name="rfcReceptor" />
        </label>
        <label>
          Razon social
          <input id="razon-social" name="legalName" />
        </label>
        <label>
          RFC emisor
          <input id="rfc-emisor" name="rfcEmisor" />
        </label>
        <label>
          Folio / ticket
          <input id="folio" name="folio" />
        </label>
        <label>
          Fecha
          <input id="fecha" name="fecha" />
        </label>
        <label>
          Total
          <input id="monto" name="monto" />
        </label>
        <label>
          Codigo postal
          <input id="cp" name="postalCode" />
        </label>
        <label>
          Correo
          <input id="emailInput" name="email" />
        </label>
        <label>
          Regimen fiscal
          <select id="regimen" name="fiscalRegime">
            <option value="">Selecciona</option>
            <option>605 - Sueldos y Salarios e Ingresos Asimilados a Salarios</option>
            <option>626 - Regimen Simplificado de Confianza</option>
          </select>
        </label>
        <label>
          Uso CFDI
          <select id="uso-cfdi" name="cfdiUse">
            <option value="">Selecciona</option>
            <option>S01 - Sin efectos fiscales</option>
            <option>G03 - Gastos en general</option>
          </select>
        </label>
        <section class="captcha-box wide" aria-label="CAPTCHA demo">
          <strong>CAPTCHA requerido</strong>
          <p>Los campos ya estan precargados. En un portal real el usuario resolveria este bloqueo y terminaria la descarga.</p>
          <label>
            Escribe 1234 para continuar
            <input id="captcha" name="captcha" autocomplete="off" />
          </label>
        </section>
        <button type="button" id="emitir">Generar factura</button>
      </form>
    </main>
  </body>
</html>
